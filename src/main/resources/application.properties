# =========================================================
# APPLICATION CONFIGURATION
# =========================================================
spring.application.name=jasper-report-springboot

# =========================================================
# SERVER CONFIGURATION
# =========================================================
server.port=8080

# =========================================================
# DATABASE CONFIGURATION
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/temp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=455445
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE CONFIGURATION
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# MESSAGE & ENCODING CONFIGURATION
# =========================================================
spring.messages.encoding=UTF-8